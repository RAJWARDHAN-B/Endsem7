<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="title description">
  <title id="title">Illustrative TileBar for an information retrieval document</title>
  <desc id="description">Two rows show term frequency over three document sections. Image occurs frequently in section one and not in the others; retrieval occurs frequently in sections one and three.</desc>
  <rect width="720" height="270" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="30" y="34" font-size="21" font-weight="bold">Query-term distribution in one document</text>
    <text x="195" y="72" font-size="15">Section 1</text>
    <text x="325" y="72" font-size="15">Section 2</text>
    <text x="455" y="72" font-size="15">Section 3</text>
    <text x="35" y="110" font-size="17">image</text>
    <text x="35" y="160" font-size="17">retrieval</text>
    <text x="35" y="216" font-size="14">White: no occurrences</text>
    <text x="260" y="216" font-size="14">Dark: more occurrences</text>
    <text x="35" y="245" font-size="14">Both terms concentrate in section 1; inspect that section first.</text>
  </g>
  <g stroke="#172033" stroke-width="2">
    <rect x="190" y="82" width="115" height="35" fill="#303030"/>
    <rect x="320" y="82" width="115" height="35" fill="#ffffff"/>
    <rect x="450" y="82" width="115" height="35" fill="#ffffff"/>
    <rect x="190" y="132" width="115" height="35" fill="#303030"/>
    <rect x="320" y="132" width="115" height="35" fill="#ffffff"/>
    <rect x="450" y="132" width="115" height="35" fill="#303030"/>
  </g>
</svg>
