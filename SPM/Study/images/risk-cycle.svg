<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">Risk management cycle</title><desc id="desc">Identify, assess, prioritize, respond, monitor, and revisit risks.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
  <rect width="1000" height="250" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Risk management is iterative</text>
  <g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a">
    <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"><path d="M170 100 H198"/><path d="M365 100 H393"/><path d="M560 100 H588"/><path d="M755 100 H783"/></g>
    <rect x="15" y="65" width="155" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="92" y="106">Identify</text>
    <rect x="200" y="65" width="165" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="282" y="96">Assess likelihood</text><text x="282" y="118">and impact</text>
    <rect x="395" y="65" width="165" height="70" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="477" y="106">Prioritize</text>
    <rect x="590" y="65" width="165" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="672" y="106">Plan response</text>
    <rect x="785" y="65" width="195" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="882" y="96">Monitor and</text><text x="882" y="118">control</text>
    <path d="M882 135 V190 H92 V140" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
    <text x="500" y="220" font-size="16">Update the register as conditions and project plans change</text>
  </g>
</svg>
