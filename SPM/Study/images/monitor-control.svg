<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc">
  <title id="title">Plan monitor control feedback cycle</title><desc id="desc">A project sets a baseline, gathers evidence, compares actual results with the plan, takes corrective action and checks the result.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
  <rect width="1000" height="270" fill="#f8fafc"/>
  <text x="500" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Plan–monitor–control cycle</text>
  <g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a">
    <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"><path d="M225 112 H266"/><path d="M495 112 H536"/><path d="M765 112 H806"/></g>
    <rect x="20" y="70" width="205" height="85" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="122" y="100" font-weight="bold">PLAN</text><text x="122" y="125">Scope, dates, budget</text>
    <rect x="270" y="70" width="225" height="85" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="382" y="100" font-weight="bold">MONITOR</text><text x="382" y="125">Measure and compare</text>
    <rect x="540" y="70" width="225" height="85" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="652" y="100" font-weight="bold">CONTROL</text><text x="652" y="125">Decide and act</text>
    <rect x="810" y="70" width="170" height="85" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="895" y="100" font-weight="bold">VERIFY</text><text x="895" y="125">Check results</text>
    <path d="M895 155 V205 H122 V160" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
    <text x="500" y="238" font-size="16">Reforecast and update an approved baseline only through change control</text>
  </g>
</svg>
