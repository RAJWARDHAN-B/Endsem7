<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Activity-on-node network for an online shop</title>
  <desc id="desc">Design leads to parallel database and payment tasks which both precede testing; design, payment and testing form the eight-day critical path.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker><marker id="critical" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#be123c"/></marker></defs>
  <rect width="1000" height="360" fill="#f8fafc"/>
  <text x="500" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Checkout project: precedence network</text>
  <g font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <path d="M255 167 L348 102" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M530 100 L618 165" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M255 193 L348 258" fill="none" stroke="#be123c" stroke-width="4" marker-end="url(#critical)"/>
    <path d="M530 260 L618 195" fill="none" stroke="#be123c" stroke-width="4" marker-end="url(#critical)"/>
    <rect x="75" y="140" width="180" height="80" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="3"/><text x="165" y="171" font-weight="bold">A: Design</text><text x="165" y="200">2 days</text>
    <rect x="350" y="60" width="180" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="440" y="91" font-weight="bold">B: Database</text><text x="440" y="120">3 days</text>
    <rect x="350" y="220" width="180" height="80" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="3"/><text x="440" y="251" font-weight="bold">C: Payment</text><text x="440" y="280">4 days</text>
    <rect x="620" y="140" width="180" height="80" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="3"/><text x="710" y="171" font-weight="bold">D: Test</text><text x="710" y="200">2 days</text>
    <text x="500" y="335" font-size="17">Critical path A → C → D = 8 days; B has 1 day of float</text>
  </g>
</svg>
